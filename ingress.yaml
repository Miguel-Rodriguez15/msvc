apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microservicios-ingress
  annotations:
    # Rate limiting: máximo 10 peticiones por segundo por IP
    nginx.ingress.kubernetes.io/limit-rps: "10"
    # Máximo 5 conexiones simultáneas por IP
    nginx.ingress.kubernetes.io/limit-connections: "5"
    # Código de respuesta cuando se excede el límite
    nginx.ingress.kubernetes.io/limit-req-status-code: "429"
    # Ráfaga permitida (burst) antes de aplicar el límite
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
    # Rewrite: quita el prefijo y reenvía / al backend
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: microservicios.local
    http:
      paths:
      - path: /usuarios
        pathType: Prefix
        backend:
          service:
            name: msvc-usuarios
            port:
              number: 8001
      - path: /cursos
        pathType: Prefix
        backend:
          service:
            name: msvc-cursos
            port:
              number: 8002
