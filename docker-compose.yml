services:
  # =======================
  # SERVICIO MYSQL
  # =======================
  mysql8:
    container_name: mysql8
    image: mysql:8
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_DATABASE: msvc_usuarios
    volumes:
      - data-mysql:/var/lib/mysql
    restart: always
    networks:
      - spring

  # =======================
  # SERVICIO POSTGRESQL
  # =======================
  postgres-cursos:
    container_name: postgres-cursos
    image: postgres:latest
    ports:
      - "5532:5432"
    environment:
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: msvc_cursos
      POSTGRES_USER: postgres
    volumes:
      - data-postgres:/var/lib/postgresql/data
    restart: always
    networks:
      - spring

  # =======================
  # MICROSERVICIO USUARIOS
  # =======================
  msvc-usuarios:
    container_name: msvc-usuarios
    image: miguelrodriguez15/msvc-usuarios:latest
#    build:
#       context: ./
#       dockerfile: ./msvc-usuarios/Dockerfile
    ports:
      - "8001:8001"
    env_file: msvc-usuarios/.env
    networks:
      - spring
    depends_on:
      - mysql8
    restart: always

  # =======================
  # MICROSERVICIO CURSOS
  # =======================
  msvc-cursos:
    container_name: msvc-cursos
    image: miguelrodriguez15/msvc-cursos:latest
#    build:
#       context: ./
#       dockerfile: ./msvc-cursos/Dockerfile
    ports:
      - "8002:8002"
    env_file: msvc-cursos/.env
    networks:
      - spring
    depends_on:
      - postgres-cursos
    restart: always

# =======================
# VOLUMENES PERSISTENTES
# =======================
volumes:
  data-mysql:
    name: data-mysql
  data-postgres:
    name: data-postgres

# =======================
# RED COMPARTIDA ENTRE SERVICIOS
# =======================
networks:
  spring:
    name: spring